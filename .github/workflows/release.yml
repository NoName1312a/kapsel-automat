# Baut Spiel + Launcher und veröffentlicht ein GitHub-Release, sobald ein Versions-Tag gepusht wird.
#   git tag v0.6.0 && git push origin v0.6.0
# Oder: Versionsnummer in der Datei VERSION ändern (z. B. 0.6.0) und nach main pushen.
# Oder ohne Git: GitHub → Actions → Release → "Run workflow", Version eintragen.
# Erwartete Repo-Struktur:
#   game/       Godot-Projekt des Spiels (mit export_presets.cfg)
#   launcher/   Godot-Projekt des Launchers
#   changelog/  optional: changelog/v0.6.0.md wird zur Release-Beschreibung,
#               sonst die Commit-Nachrichten seit dem letzten Tag
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version, z. B. v0.6.0 (der Tag wird aus dem gewählten Branch angelegt, falls es ihn noch nicht gibt)"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Tag bestimmen
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(tr -d ' \r\n' < VERSION)"
            TAG="${TAG#vv}"; TAG="v${TAG#v}"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Release $TAG gibt es schon, nichts zu tun."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - if: steps.tag.outputs.skip != 'true'
        name: Godot holen
        # Export-Vorlagen braucht es nicht: Spiel und Launcher werden nur als .pck gebaut.
        # Als Programm liefern wir die offizielle, von Godot signierte Windows-.exe aus.
        run: |
          set -e
          V="$GODOT_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${V}-stable_linux.x86_64" godot
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o godot_win.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_win64.exe.zip"
          unzip -q godot_win.zip "Godot_v${V}-stable_win64.exe"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - if: steps.tag.outputs.skip != 'true'
        name: Versionsnummer ins Spiel schreiben
        run: |
          VER="${{ steps.tag.outputs.version }}"
          F=game/project.godot
          if grep -q '^config/version=' "$F"; then
            sed -i "s/^config\/version=.*/config\/version=\"$VER\"/" "$F"
          else
            sed -i "s/^\[application\]$/[application]\n\nconfig\/version=\"$VER\"/" "$F"
          fi
          grep '^config/version=' "$F"

      - if: steps.tag.outputs.skip != 'true'
        name: Spiel exportieren
        # Das Spiel wird nur als .pck (Spieldaten) gebaut. Der Launcher startet es mit
        # seiner eigenen .exe, so muss Windows nur ein einziges Programm zulassen.
        run: |
          set -e
          mkdir -p build/game
          godot --headless --path game --import || true
          godot --headless --path game --export-pack "Windows Desktop" "$PWD/build/game/KapselAutomat.pck"
          test -s build/game/KapselAutomat.pck

      - if: steps.tag.outputs.skip != 'true'
        name: Launcher testen
        run: sh launcher/tests/run_tests.sh godot

      - if: steps.tag.outputs.skip != 'true'
        name: Launcher bauen
        # KapselLauncher.exe ist die unveränderte, signierte Godot-.exe (nur umbenannt).
        # Godot lädt automatisch die gleichnamige KapselLauncher.pck daneben.
        # Die .exe darf nicht verändert werden (kein rcedit, kein eingebettetes .pck),
        # sonst ist die Signatur kaputt und Windows Smart App Control blockiert sie.
        run: |
          set -e
          mkdir -p build/launcher-windows build/launcher-linux
          godot --headless --path launcher --import || true
          godot --headless --path launcher --export-pack "Windows Desktop" "$PWD/build/launcher-windows/KapselLauncher.pck"
          cp "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_win64.exe" build/launcher-windows/KapselLauncher.exe
          cp build/launcher-windows/KapselLauncher.pck build/launcher-linux/KapselLauncher.pck
          cp "$RUNNER_TEMP/godot" build/launcher-linux/KapselLauncher.x86_64
          python3 launcher/tests/check_signature.py build/launcher-windows/KapselLauncher.exe
          # Dieselbe .pck noch einmal als Selbst-Update: installierte Launcher laden sie beim Start
          # nach, wenn die Version in launcher/scripts/version.gd neuer ist als ihre eigene.
          LV=$(sed -n 's/^const VERSION := "\(.*\)"$/\1/p' launcher/scripts/version.gd)
          test -n "$LV"
          echo "Launcher-Version: $LV"
          cp build/launcher-windows/KapselLauncher.pck "build/launcher-app-${LV}.pck"

      - if: steps.tag.outputs.skip != 'true'
        name: Pakete schnüren
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p dist
          (cd build/game && zip -qr "../../dist/kapsel-automat-${TAG}-game.zip" .)
          cp "launcher/LIES MICH.txt" build/launcher-windows/
          (cd build/launcher-windows && zip -qr "../../dist/kapsel-launcher-windows.zip" .)
          (cd build/launcher-linux && zip -qr "../../dist/kapsel-launcher-linux.zip" .)
          cp build/launcher-app-*.pck dist/
          ls -la dist

      - if: steps.tag.outputs.skip != 'true'
        name: Release-Text
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -f "changelog/${TAG}.md" ]; then
            cp "changelog/${TAG}.md" notes.md
          else
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            RANGE="${PREV:+$PREV..}HEAD"
            { echo "## Änderungen"; git log --no-merges --pretty='- %s' "$RANGE"; } > notes.md
          fi
          cat notes.md

      - if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kapsel-Automat ${{ steps.tag.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            dist/*.zip
            dist/*.pck
